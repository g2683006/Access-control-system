# 配置模板：复制成同目录的 application.yml 再填写。
# application.yml 已被 .gitignore 忽略，里面的数据库密码和百度密钥不会被提交。
# 原仓库没有附带 application.yml，下面的键是按代码里用到的配置整理的，值都是示例。

server:
  port: 8888                    # 前端 meeting/src/util/request.js 里写的后端地址是 http://localhost:8888

spring:
  datasource:
    # DruidConfig 会把 spring.datasource.* 绑定到 Druid 连接池
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rookismeeting?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8
    username: root
    password: change-me
  redis:
    # 注意：MyApplicationRunner 在启动时会清空这个 Redis 里的所有 key，不要连到和别的程序共用的 Redis
    host: localhost
    port: 6379
    database: 0

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

# 百度智能云人脸识别（https://console.bce.baidu.com/ai/#/ai/face/overview/index）
# 代码里用的人脸库分组名是 employee，需要先在控制台建好
baidu:
  appId: your-app-id
  key: your-api-key
  secret: your-secret-key

# 注册时上传的人脸照片保存目录（代码直接拼接文件名，结尾要带 /）
files:
  upload:
    path: /path/to/RookieMeeting/files/

# 人脸登录、签到时的临时照片目录（结尾同样要带 /）
photo:
  tmp: /path/to/RookieMeeting/tmp/
