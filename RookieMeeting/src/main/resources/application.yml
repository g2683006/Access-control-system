# 默认配置：本机 MySQL（root / root）+ 本机 Redis，不开人脸识别，装好数据库后可以直接启动。
# 要改数据库密码或填百度人脸识别的密钥，不要改这个文件：
# 把同目录的 application-local.example.yml 复制成 application-local.yml 再改，
# 它会覆盖这里的同名配置，并且已经被 .gitignore 忽略，不会被提交。
# 用 java -jar 运行打好的包时，也可以把 application-local.yml 放在启动目录下。

server:
  port: 8888                    # 前端默认请求 http://localhost:8888，改端口的话前端也要改（见 meeting/.env）

spring:
  config:
    import: optional:classpath:application-local.yml,optional:file:./application-local.yml
  datasource:
    # DruidConfig 会把 spring.datasource.* 绑定到 Druid 连接池
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 没写 serverTimezone：驱动会按本机时区读写时间，和 Jackson 的配置（JacksonConfig）保持一致
    url: jdbc:mysql://localhost:3306/rookismeeting?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    # 用来存登录 token 和 MyBatis 二级缓存；启动时会清掉本系统留下的旧缓存（MyApplicationRunner），不动别的键
    host: localhost
    port: 6379
    database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

# 百度智能云人脸识别（https://console.bce.baidu.com/ai/#/ai/face/overview/index）
# enabled 为 false 时是演示模式：人脸登录不可用；录入人脸只保存照片；会议签到不做人脸比对，照片可以不传。
# 填好密钥并改成 true 后才会真正调用百度接口。代码里用的人脸库分组名是 employee，需要先在控制台建好。
baidu:
  enabled: false
  appId: ""
  key: ""
  secret: ""

# 人脸照片保存目录、刷脸时的临时照片目录（相对路径是相对启动目录，目录不存在会自动创建）
files:
  upload:
    path: ./data/faces/
photo:
  tmp: ./data/tmp/
